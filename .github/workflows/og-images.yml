# Polaroid link previews: draws each product as a polaroid on paper
# (tools/og/make_og.py) into assets/jvli-og-<handle>.jpg and commits any
# changes to main, which Shopify's GitHub integration puts on the live theme.
# snippets/meta-tags.liquid shares these images for product links.
name: Link preview images

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: og-images
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow and fonts
        run: |
          pip install pillow
          mkdir -p /tmp/fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -sSfL -o /tmp/fonts/Newsreader.ttf "$base/newsreader/Newsreader%5Bopsz,wght%5D.ttf"
          curl -sSfL -o /tmp/fonts/Hand.ttf "$base/nothingyoucoulddo/NothingYouCouldDo.ttf"
          curl -sSfL -o /tmp/fonts/Jost.ttf "$base/jost/Jost%5Bwght%5D.ttf"

      - name: Draw the previews
        run: |
          python tools/og/make_og.py --store https://thejvlistore.in --theme . \
            --serif /tmp/fonts/Newsreader.ttf --hand /tmp/fonts/Hand.ttf --caps /tmp/fonts/Jost.ttf

      - name: Commit changes
        run: |
          git config user.name "jvli-link-previews[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jvli-og-*.jpg snippets/jvli-og-handles.liquid
          git add -u assets
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore(og): refresh product link previews"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
